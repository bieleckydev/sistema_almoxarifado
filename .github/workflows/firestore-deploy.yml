name: Deploy das regras e índices do Firestore

# Publica firestore.rules e firestore.indexes.json no projeto de produção quando
# esses arquivos mudam na main (ou manualmente). Antes do deploy, as regras são
# testadas no emulador.
#
# Pré-requisito: secret FIREBASE_SERVICE_ACCOUNT com o JSON de uma conta de
# serviço com os papéis "Firebase Rules Admin" e "Cloud Datastore Index Admin".

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:

concurrency:
  group: firestore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Testar regras no emulador
        run: npm run test:rules

      - name: Preparar credenciais
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT não configurado."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Publicar regras e índices
        run: npx -y firebase-tools@14.11.0 deploy --only firestore:rules,firestore:indexes --project rhowert-a57af --non-interactive
