name: CI — Almoxarifado Industrial

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Typecheck, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificação estática de tipos (TypeScript)
        run: npm run typecheck

      - name: Executar suíte de testes unitários e de integração
        run: npm test

      - name: Build de produção Next.js
        run: npm run build
